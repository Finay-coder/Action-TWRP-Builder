name: X688B TWRP Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: X688B
      DEVICE_TREE_BRANCH: "11"
      PRODUCT: twrp_X688B-eng

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git \
            git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush python3 \
            rsync squashfs-tools unzip zip \
            zlib1g-dev openjdk-8-jdk

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP
        run: |
          mkdir -p twrp
          cd twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11

      - name: Sync source
        run: |
          cd twrp
          repo sync -c --no-clone-bundle \
            --no-tags --optimized-fetch \
            --prune --force-sync -j2

      - name: Clone X688B tree
        run: |
          mkdir -p twrp/device/infinix

          git clone --depth=1 \
            -b "$DEVICE_TREE_BRANCH" \
            https://github.com/NeonzDump/twrp_infinix_X688B.git \
            twrp/device/infinix/X688B

          test -s twrp/device/infinix/X688B/BoardConfig.mk
          test -s twrp/device/infinix/X688B/AndroidProducts.mk
          test -s twrp/device/infinix/X688B/twrp_X688B.mk

      - name: Build recovery
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          source build/envsetup.sh
          lunch "$PRODUCT"

          mka -j2 recoveryimage 2>&1 | tee build.log

      - name: Upload recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X688B-TWRP
          path: twrp/out/target/product/X688B/recovery.img
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X688B-TWRP-Logs
          path: |
            twrp/build.log
          if-no-files-found: warn
          retention-days: 14