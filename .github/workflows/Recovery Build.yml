name: X688B Android 11 Recovery Builder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit = inspect donor only; build = compile TWRP 11 for X688B"
        required: true
        type: choice
        options:
          - audit
          - build
        default: audit
      donor_github_url:
        description: "Optional public GitHub repo for Android 11 donor recovery/device tree"
        required: false
        type: string
        default: ""
      donor_branch:
        description: "Donor repo branch"
        required: false
        type: string
        default: "main"
      donor_device_tree_path:
        description: "Optional path inside donor repo containing BoardConfig.mk"
        required: false
        type: string
        default: ""
      target_build:
        description: "Target firmware label"
        required: true
        type: string
        default: "V788-XOS7.6.0-Android11"
      stock_boot_url:
        description: "Optional direct HTTPS URL to original V788 stock boot.img; otherwise use stock/boot.img"
        required: false
        type: string
        default: ""
      stock_dtbo_url:
        description: "Optional direct HTTPS URL to V788 stock dtbo.img"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  TZ: Asia/Jakarta
  TARGET_BUILD: ${{ inputs.target_build }}
  BUILD_MODE: ${{ inputs.mode }}
  DONOR_GITHUB_URL: ${{ inputs.donor_github_url }}
  DONOR_BRANCH: ${{ inputs.donor_branch }}
  DONOR_DEVICE_TREE_PATH: ${{ inputs.donor_device_tree_path }}
  STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
  STOCK_DTBO_URL: ${{ inputs.stock_dtbo_url }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/cmdline-tools || true
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools unzip xmlstarlet \
            xsltproc zip zlib1g-dev python-is-python3

      - name: Run donor audit / X688B build
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/build_x688b.sh 2>&1 | tee artifacts/build.log

      - name: Upload build and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X688B-TWRP11-output
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
